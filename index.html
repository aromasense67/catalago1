<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroma Sense | Catálogo de perfumes árabes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEBEA; --card:#F7F6F5; --ink:#121212; --muted:#66645F; --line:#D6D3D0;
  --cherry:#B83A5C; --on-cherry:#FFFFFF; color-scheme:light; --blue:#2F63B5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --card:#1B1B1B; --ink:#EFEDEA; --muted:#A09D98; --line:#2D2D2D;
    --cherry:#E0607F; --on-cherry:#141414; color-scheme:dark; --blue:#6FA3EA;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1B1B1B; --ink:#EFEDEA; --muted:#A09D98; --line:#2D2D2D;
  --cherry:#E0607F; --on-cherry:#141414; color-scheme:dark; --blue:#6FA3EA;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header{text-align:center;padding:44px 0 24px}
h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(46px,12vw,76px);line-height:1;margin:0;letter-spacing:.01em}
.tag{margin:12px 0 0;color:var(--muted);font-size:17px}
.drop{display:inline-block;margin-top:18px;padding:6px 16px;border:1px solid var(--cherry);color:var(--cherry);border-radius:999px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;justify-content:center;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column}
.art{height:170px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px}
.art img{width:100%;height:100%;object-fit:contain;display:block}
.art.ph{background:none;border-bottom:1px solid var(--line);border-radius:0}
.art svg{height:96px;width:auto}
.brand{margin:0;color:var(--muted);font-size:13px}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px;line-height:1.15;margin:2px 0 6px}
.desc{margin:0 0 12px;font-size:14px;color:var(--muted);flex:1}
.row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.price{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600}
.stock{font-size:13px;color:var(--cherry)}
.stock.out{color:var(--muted)}
.btn{display:block;text-align:center;text-decoration:none;font-size:15px;font-weight:500;padding:11px 8px;border-radius:10px;background:var(--cherry);color:var(--on-cherry)}
.btn.off{background:var(--line);color:var(--muted);pointer-events:none}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:36px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,.tag,.drop,.chips{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.tag{animation-delay:.12s}.drop{animation-delay:.24s}.chips{animation-delay:.36s}
.card{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.card.in{opacity:1;transform:none}
.btn,.chip{transition:transform .15s ease,background-color .25s ease,color .25s ease,border-color .25s ease}
.btn:active{transform:scale(.96)}
.chip:active{transform:scale(.94)}
:root{--shine:var(--cherry)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shine:var(--cherry)}}
:root[data-theme="dark"]{--shine:var(--cherry)}
@keyframes shine{0%{background-position:100% 0}30%{background-position:0 0}100%{background-position:0 0}}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  h1{background-image:linear-gradient(100deg,var(--ink) 0%,var(--ink) 33%,var(--shine) 50%,var(--ink) 67%,var(--ink) 100%);background-size:300% 100%;background-position:0 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:rise .8s cubic-bezier(.2,.7,.2,1) both,shine 8s .5s ease-in-out infinite}
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.07)}}
.stock.last{animation:pulse 2.6s ease-in-out infinite}
.fab{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;border-radius:50%;background:var(--cherry);color:var(--on-cherry);text-decoration:none;font-weight:500;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateY(28px);transition:opacity .4s ease,transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s .55s}
.fab.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.fab:active{transform:scale(.95)}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h2 button{all:unset;display:inline;cursor:pointer;border-bottom:1px dashed var(--cherry);padding-bottom:1px;-webkit-tap-highlight-color:transparent}
h2 button:focus-visible{outline:2px solid var(--cherry);outline-offset:3px}
.card .art{cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:0 0 16px}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s}
.sheet-bg.open{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.sheet-bg.open .sheet{transform:none}
@media(min-width:720px){.sheet-bg{display:flex;align-items:center;justify-content:center}.sheet{position:relative;border-radius:20px;max-height:88%;margin:0}}
.x{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.sheet .art{height:230px;margin-top:6px;cursor:default}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.pill{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.g{border-color:var(--cherry);color:var(--cherry)}
.pill.m{border-color:var(--blue);color:var(--blue)}
.sheet h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;line-height:1.1;margin:2px 0 8px}
.sheet p{margin:0 0 12px}
.sheet .brand{margin:0}
.notes{border-top:1px solid var(--line);margin:14px 0 12px}
.notes div{padding:9px 0;border-bottom:1px solid var(--line)}
.notes b{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.sheet .btn{margin-top:4px}
.lim{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:21px;color:var(--muted);margin:16px 0 0;animation:rise .8s .45s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
footer a{color:var(--cherry)}
</style>
</head>

const sbg = document.getElementById('sbg');
let lastFocus = null;
function openSheet(x){
  const i = INFO[x.n] || {};
  const out = x.s <= 0;
  const msg = 'Hola Aroma Sense, quiero el ' + x.n + ' (' + x.b + ') de $' + x.p + '. ¿Está disponible?';
  const row = (l, v) => `<div><b>${l}</b>${v}</div>`;
  const notes = i.t ? row('Salida', i.t) + row('Corazón', i.h) + row('Fondo', i.b) : (i.n ? row('Notas principales', i.n) : '');
  document.getElementById('sbody').innerHTML =
    (IMG[x.n] ? `<div class='art'><img src='${IMG[x.n]}' alt='${x.n} ${x.b}'></div>` : '') +
    `<div class='pills'>${i.g ? `<span class='pill g${i.g === "Hombre" ? " m" : ""}'>${i.g}</span>` : ''}<span class='pill'>${x.f}</span>${i.s ? `<span class='pill'>${i.s}</span>` : ''}</div>` +
    `<p class='brand'>${x.b}</p><h3 id='sname'>${x.n}</h3><p>${x.d}</p>` +
    (notes ? `<div class='notes'>${notes}</div>` : '') +
    (i.u ? `<p><b>Ideal para:</b> ${i.u}</p>` : '') +
    `<div class='row'><span class='price'>$${x.p}</span><span class='stock${out ? ' out' : ''}'>${stockText(x.s)}</span></div>` +
    `<a class='btn${out ? ' off' : ''}' target='_blank' rel='noopener' href='https://wa.me/${WA}?text=${encodeURIComponent(msg)}'>${out ? 'Agotado' : 'Pedir por WhatsApp'}</a>`;
  lastFocus = document.activeElement;
  sbg.classList.add('open');
  sbg.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('sx').focus();
}
function closeSheet(){
  sbg.classList.remove('open');
  sbg.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
sbg.addEventListener('click', e => { if (e.target === sbg) closeSheet(); });
document.getElementById('sx').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function bottle(color){
  return '<svg viewBox="0 0 60 80" aria-hidden="true"><rect x="22" y="3" width="16" height="14" rx="2" fill="currentColor"/>' +
    '<rect x="10" y="17" width="40" height="60" rx="9" fill="' + color + '"/>' +
    '<rect x="16" y="26" width="7" height="40" rx="3.5" fill="#fff" opacity=".28"/></svg>';
}

function stockText(s){
  if (s <= 0) return "Agotado";
  return "";
}

function render(){
  grid.innerHTML = "";
  P.filter(x => current === "Todos" || x.f === current).forEach((x, idx) => {
    const out = x.s <= 0;
    const msg = "Hola Aroma Sense, quiero el " + x.n + " (" + x.b + ") de $" + x.p + ". ¿Está disponible?";
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML =
      (IMG[x.n] ? '<div class="art"><img src="' + IMG[x.n] + '" alt="' + x.n + ' ' + x.b + '" loading="lazy"></div>' : '<div class="art ph" style="color:var(--ink)">' + bottle(COLORS[x.f]) + '</div>') +
      '<p class="brand">' + x.b + '</p>' +
      '<h2><button type="button" class="nm">' + x.n + '</button></h2>' +
      '<p class="desc">' + x.d + '</p>' +
      '<div class="row"><span class="price">$' + x.p + '</span><span class="stock' + (out ? " out" : "") + '">' + stockText(x.s) + '</span></div>' +
      '<a class="btn' + (out ? " off" : "") + '" target="_blank" rel="noopener" href="https://wa.me/' + WA + '?text=' + encodeURIComponent(msg) + '">' +
      (out ? "Agotado" : "Pedir por WhatsApp") + '</a>';
    card.querySelector(".nm").onclick = () => openSheet(x);
    card.querySelector(".art").onclick = () => openSheet(x);
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
    card.style.transitionDelay = (idx % cols) * 90 + "ms";

// Pega entre las comillas el link CSV publicado de tu hoja de Google.
// Mientras esté vacío, la página funciona igual que antes.
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNJQpUqf56Srei5VgRiY0OfoKxJ-Oj7BqaLQqs-OMsnkK_a_6dKXnbwz3niQSywQrov8jEvuQEg_T2/pub?gid=1287549841&single=true&output=csv";

function norm(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }
function parseCSV(t){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function aplicarSheet(){
  if (!SHEET_CSV) return;
  try {
    const r = await fetch(SHEET_CSV + (SHEET_CSV.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    let changed = false;
    parseCSV(await r.text()).forEach(row => {
      const x = P.find(p => norm(p.n) === norm(row[0]));
      if (!x) return;
      const ns = norm(row[1]).indexOf("agot") > -1 ? 0 : Math.max(x.s, 1);
      if (ns !== x.s){ x.s = ns; changed = true; }
    });
    if (changed) render();
  } catch (e) { /* si falla, la página sigue con su disponibilidad normal */ }
}
aplicarSheet();
